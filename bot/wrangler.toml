# Discord bot Worker (HTTP Interactions + Cron Triggers).
# Do not add routes or custom domains. Only one bot may run on the token: stop
# any Node bot process first, or Discord delivers every command twice.
# Deploy with OKMR_ALLOW_BOT_DEPLOY=1.
name = "okmr-bot"
account_id = "ac106c3c37d5d9077a632960175f4a52"
main = "src/worker.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true
head_sampling_rate = 1

[observability.traces]
enabled = true
head_sampling_rate = 1

[vars]
CLUB_TIMEZONE = "America/Vancouver"

# Cron Trigger: checks /config channel reminder schedules and syncs Discord
# Scheduled Events every 5 minutes (stays well within Cloudflare's Free Tier).
[triggers]
crons = ["*/5 * * * *"]

# Shared D1 database (same binding as okmr-web). Remote migrations are gated.
[[d1_databases]]
binding = "DB"
database_name = "okmr-db"
database_id = "92805d40-9fe6-443e-89a4-ffafe0e0c209"
migrations_dir = "../prisma/migrations"
migrations_pattern = "../prisma/migrations/*/migration.sql"

# Dev-journal attachments. Workers KV is on the free plan: 1 GB stored,
# 1,000 writes/day, 25 MiB per value. Writes fail at the quota; nothing bills.
[[kv_namespaces]]
binding = "UPLOADS_KV"
id = "5a172e41ffa64dfe9b02b0b9063a7080"
