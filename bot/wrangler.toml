name = "okmr-bot"
main = "src/worker.ts"
compatibility_date = "2025-02-01"
compatibility_flags = ["nodejs_compat"]

[vars]
CLUB_TIMEZONE = "America/Vancouver"

# Cron Trigger: checks /config channel reminder schedules and syncs Discord
# Scheduled Events every 5 minutes (stays well within Cloudflare's Free Tier).
[triggers]
crons = ["*/5 * * * *"]

# Shared Cloudflare D1 SQLite database (same database bound to okmr-web).
# Run `npx wrangler d1 create okmr-db` and paste the database_id below.
[[d1_databases]]
binding = "DB"
database_name = "okmr-db"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "../prisma/migrations"

# Shared Cloudflare R2 bucket for /progupdate attachments (same bucket bound to okmr-web).
# Run `npx wrangler r2 bucket create okmr-uploads` once in your Cloudflare account.
[[r2_buckets]]
binding = "UPLOADS_BUCKET"
bucket_name = "okmr-uploads"
