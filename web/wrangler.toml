# Club web app on Cloudflare Workers with static assets.
# This is the main Worker for the app. It is not a preview branch.
#
# Do not add routes, custom domains, or zone ids. okmrwebapp.ca stays on its
# existing tunnel, and the unrelated Worker okmarinerobotics-com must not be
# changed. After a future deploy the only hostname is
# https://okmr-web.okmarinerobotics.workers.dev — and that URL is public until
# Worker-scoped Cloudflare Access is enabled. Do not enable account-wide Access.
name = "okmr-web"
account_id = "ac106c3c37d5d9077a632960175f4a52"
main = ".open-next/worker.js"
compatibility_date = "2026-11-08"
compatibility_flags = ["nodejs_compat"]
upload_source_maps = true
workers_dev = true
preview_urls = false

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Persistent logs and traces stay off, matching the live okmr-web Worker.
# A Git deploy must not turn them on.
[observability]
enabled = false

[observability.logs]
enabled = false

[observability.traces]
enabled = false

[vars]
CLUB_TIMEZONE = "America/Vancouver"

# Shared D1 database (also bound by okmr-bot). All prisma/migrations are
# applied; new remote migrations need OKMR_ALLOW_D1_REMOTE=1.
[[d1_databases]]
binding = "DB"
database_name = "okmr-db"
database_id = "92805d40-9fe6-443e-89a4-ffafe0e0c209"
migrations_dir = "../prisma/migrations"
migrations_pattern = "../prisma/migrations/*/migration.sql"

# Dev-journal attachments. Workers KV is on the free plan: 1 GB stored,
# 1,000 writes/day, 25 MiB per value. Writes fail at the quota; nothing bills.
[[kv_namespaces]]
binding = "UPLOADS_KV"
id = "5a172e41ffa64dfe9b02b0b9063a7080"
