name = "okmr-web"
main = ".open-next/worker.js"
compatibility_date = "2025-02-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[vars]
CLUB_TIMEZONE = "America/Vancouver"

# Shared Cloudflare D1 SQLite database (same database bound to okmr-bot).
# Run `npx wrangler d1 create okmr-db` and paste the database_id below.
[[d1_databases]]
binding = "DB"
database_name = "okmr-db"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "../prisma/migrations"

# Shared Cloudflare R2 bucket for /progupdate attachments (same bucket bound to okmr-bot).
# Run `npx wrangler r2 bucket create okmr-uploads` once in your Cloudflare account.
[[r2_buckets]]
binding = "UPLOADS_BUCKET"
bucket_name = "okmr-uploads"
