# Club web app on Cloudflare Workers with static assets.
# This is the main Worker for the app. It is not a preview branch.
#
# Do not add routes, custom domains, or zone ids. okmrwebapp.ca stays on its
# existing tunnel, and the unrelated Worker okmarinerobotics-com must not be
# changed. After a future deploy the only hostname is
# https://okmr-web.okmarinerobotics.workers.dev — and that URL is public until
# Worker-scoped Cloudflare Access is enabled. Do not enable account-wide Access.
name = "okmr-web"
account_id = "ac106c3c37d5d9077a632960175f4a52"
main = ".open-next/worker.js"
compatibility_date = "2026-11-08"
compatibility_flags = ["nodejs_compat"]
upload_source_maps = true
workers_dev = true
preview_urls = false

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true
head_sampling_rate = 1

[observability.traces]
enabled = true
head_sampling_rate = 1

[vars]
CLUB_TIMEZONE = "America/Vancouver"

# Existing empty D1 database (0 tables as of 2026-11-08). Do not apply remote
# migrations until that step is explicitly approved. The Pi SQLite database is
# not this database and is not migrated here.
[[d1_databases]]
binding = "DB"
database_name = "okmr-db"
database_id = "92805d40-9fe6-443e-89a4-ffafe0e0c209"
migrations_dir = "../prisma/migrations"
migrations_pattern = "../prisma/migrations/*/migration.sql"

# R2 is not enabled on the account yet. Create this bucket only after R2 is
# turned on. Uploads fail closed until the binding exists; do not fall back to
# a public r2.dev URL.
[[r2_buckets]]
binding = "UPLOADS_BUCKET"
bucket_name = "okmr-uploads"
